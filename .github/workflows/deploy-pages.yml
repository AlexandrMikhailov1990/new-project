name: Deploy to GitHub Pages

on:
  push:
    branches: [main, cursor/gym-workout-app-3157]
  workflow_dispatch:

# Publishes a static build to the gh-pages branch.
# Enable hosting once in the repo: Settings → Pages → Deploy from a branch → gh-pages.
# Does NOT use actions/deploy-pages (that requires Pages to already be enabled and fails CI otherwise).

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
